<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn American Sign Language with your webcam and real-time feedback." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CoSign · Learn ASL</title>
    <script>
      // Apply the saved (or system) theme before first paint; src/lib/theme.ts takes over after.
      try {
        var saved = localStorage.getItem('cosign:theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
